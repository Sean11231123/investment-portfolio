name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Taiwan prices
        run: python scripts/update_tw_prices.py

      - name: Update TPEx OTC prices
        run: python scripts/update_tpex_otc_prices.py

      - name: Update US macro indicators
        run: python scripts/update_macro_indicators.py

      - name: Update FOMC macro events
        run: python scripts/update_macro_events.py

      - name: Commit market data if changed
        run: |
          if git diff --quiet -- public/data/market/tw-prices.json public/data/market/tpex-otc-prices.json public/data/macro/macro-indicators.json public/data/macro/macro-events.json; then
            echo "No market or macro data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/market/tw-prices.json
          git add public/data/market/tpex-otc-prices.json
          git add public/data/macro/macro-indicators.json
          git add public/data/macro/macro-events.json
          git commit -m "Update market and macro data"
          git pull --rebase origin main
          git push origin HEAD:main
